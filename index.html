<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Devi ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      width: 90%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    .name-tag {
      font-size: 20px;
      font-weight: 700;
      color: #ff4d6d;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      color: #333;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background-color: #f0f0f0;
      color: #666;
      position: absolute;
      transition: all 0.2s ease;
    }

    #celebration {
      display: none;
    }

    #celebration h2 {
      font-size: 28px;
      color: #ff3366;
      margin-bottom: 12px;
    }

    #celebration p {
      font-size: 18px;
      color: #555;
      line-height: 1.5;
    }

    .heart-icon {
      font-size: 55px;
      margin-bottom: 15px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* Floating background hearts */
    .bg-heart {
      position: absolute;
      color: rgba(255, 105, 145, 0.35);
      user-select: none;
      pointer-events: none;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card" id="questionCard">
    <div class="heart-icon">💖</div>
    <div class="name-tag">Hey Devi ✨</div>
    <h1>I love you!<br>Will you be mine?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes! 💕</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div class="card" id="celebration">
    <div class="heart-icon">🎉🥰💍</div>
    <h2>Yay, Devi! ❤️</h2>
    <p>You just made me the happiest person! Can't wait to see you.</p>
  </div>
