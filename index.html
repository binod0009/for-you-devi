<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Devi ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      width: 90%;
      max-width: 400px;
      position: relative;
      z-index: 10;
    }

    .heart-icon {
      font-size: 50px;
      margin-bottom: 10px;
      animation: pulse 1.2s infinite;
    }

    .name-tag {
      font-size: 19px;
      font-weight: 700;
      color: #ff4d6d;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .love-note {
      font-size: 16px;
      color: #555;
      margin-bottom: 18px;
      line-height: 1.5;
      font-style: italic;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 25px;
      line-height: 1.35;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      transition: transform 0.15s ease;
      z-index: 5;
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background-color: #f0f0f0;
      color: #666;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 99;
      transition: transform 0.1s ease;
    }

    #celebration {
      display: none;
    }

    #celebration h2 {
      font-size: 28px;
      color: #ff3366;
      margin-bottom: 12px;
    }

    #celebration p {
      font-size: 18px;
      color: #555;
      line-height: 1.5;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 105, 145, 0.35);
      user-select: none;
      pointer-events: none;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      20% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="questionCard">
    <div class="heart-icon">💖</div>
    <div class="name-tag">Hey Devi ✨</div>
    <p class="love-note">
      I've had feelings for you ever since the first day we met, and I've been waiting for the right moment to tell you...
    </p>
    <h1>I love you!<br>Will you be mine?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes! 💕</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div class="card" id="celebration">
    <div class="heart-icon">🎉🥰💍</div>
    <h2>Yay, Devi! ❤️</h2>
    <p>You just made me the happiest person! Can't wait to see you.</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionCard = document.getElementById('questionCard');
    const celebration = document.getElementById('celebration');

    function teleportNoButton(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const btnW = noBtn.offsetWidth || 80;
      const btnH = noBtn.offsetHeight || 45;
      const pad = 20;

      const maxX = window.innerWidth - btnW - pad;
      const maxY = window.innerHeight - btnH - pad;

      const randX = Math.floor(Math.random() * (maxX - pad)) + pad;
      const randY = Math.floor(Math.random() * (maxY - pad)) + pad;

      noBtn.style.position = 'fixed';
      noBtn.style.left = randX + 'px';
      noBtn.style.top = randY + 'px';
    }

    noBtn.addEventListener('touchstart', teleportNoButton, { passive: false });
    noBtn.addEventListener('pointerdown', teleportNoButton);
    noBtn.addEventListener('mouseover', teleportNoButton);
    noBtn.addEventListener('click', teleportNoButton);

    yesBtn.addEventListener('click', () => {
      questionCard.style.display = 'none';
      celebration.style.display = 'block';
      spawnLotsOfHearts();
    });

    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.classList.add('bg-heart');
      heart.textContent = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = Math.random() * 20 + 15 + 'px';
      heart.style.animationDuration = Math.random() * 3 + 4 + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createFloatingHeart, 450);

    function spawnLotsOfHearts() {
      for (let i = 0; i < 25; i++) {
        setTimeout(createFloatingHeart, i * 80);
      }
    }
  </script>
</body>
</html>
