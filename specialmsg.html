<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Question for You Devi❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 420px;
      position: relative;
    }

    h1 {
      font-size: 26px;
      color: #ff3366;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #555;
      position: absolute;
      transition: all 0.2s ease;
    }

    /* Success screen hidden by default */
    #celebration {
      display: none;
    }

    #celebration h2 {
      font-size: 28px;
      color: #ff3366;
      margin-bottom: 12px;
    }

    #celebration p {
      font-size: 18px;
      color: #444;
    }

    .heart-icon {
      font-size: 50px;
      margin-bottom: 15px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="questionCard">
    <div class="heart-icon">💖</div>
    <h1>I love you! Will you be mine?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes!</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div class="card" id="celebration">
    <div class="heart-icon">🎉❤️🥰</div>
    <h2>Yay! Best decision ever!</h2>
    <p>You just made my entire day! Can't wait to see you soon.</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionCard = document.getElementById('questionCard');
    const celebration = document.getElementById('celebration');

    // Default position for No button
    noBtn.style.left = '55%';

    function moveNoButton() {
      // Get dimensions of window and button
      const maxWidth = window.innerWidth - noBtn.offsetWidth - 20;
      const maxHeight = window.innerHeight - noBtn.offsetHeight - 20;

      // Teleport anywhere on screen
      const randomX = Math.max(10, Math.floor(Math.random() * maxWidth));
      const randomY = Math.max(10, Math.floor(Math.random() * maxHeight));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Moves on hover (mouse) and touch (phone)
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      questionCard.style.display = 'none';
      celebration.style.display = 'block';
    });
  </script>
</body>
</html>
